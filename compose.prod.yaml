services:
  traefik:
    image: traefik:v3.1
    container_name: ems-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Global HTTP to HTTPS redirect
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # ACME Let's Encrypt TLS challenge
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt
    networks:
      - ems-network

  ems:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems-service
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - EMS_ENV=production
      - EMS_HTTP_ADDR=:8080
      - EMS_DATABASE_URL=postgres://${POSTGRES_USER:-ems}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ems}?sslmode=disable
      - EMS_MASTER_KEY=${EMS_MASTER_KEY}
      - EMS_API_KEY=${EMS_API_KEY}
      - EMS_LOG_LEVEL=${EMS_LOG_LEVEL:-info}
      - EMS_RATE_LIMIT=${EMS_RATE_LIMIT:-120}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ems.rule=Host(`${EMS_DOMAIN:-ems.example.com}`)"
      - "traefik.http.routers.ems.entrypoints=websecure"
      - "traefik.http.routers.ems.tls=true"
      - "traefik.http.routers.ems.tls.certresolver=myresolver"
      - "traefik.http.services.ems.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - ems-network

  postgres:
    image: postgres:16-alpine
    container_name: ems-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ems}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ems} -d ${POSTGRES_DB:-ems}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ems-network

networks:
  ems-network:
    driver: bridge

volumes:
  pgdata:
  traefik-certificates:
